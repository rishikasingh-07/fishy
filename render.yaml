services:
  - type: web
    name: fishy
    runtime: python
    plan: free            # 512 MB RAM is tight for torch + ResNet50; upgrade the plan if it runs out of memory
    buildCommand: pip install -r requirements.txt && python fetch_backbone.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
